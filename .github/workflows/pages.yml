# Publica el prototipo en GitHub Pages en cada push a main.
# Build "estático": el catálogo corre en el navegador con los datos de backend/data (sin servidor).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build estático
        run: npm run build
        env:
          VITE_STATIC: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
      # GitHub Pages no tiene fallback para SPA: 404.html = index.html permite entrar directo a /catalogo o /producto/:id
      - run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
