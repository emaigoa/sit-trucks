# Mantiene despierto el servidor de Render (plan gratis: se duerme tras 15 min sin visitas y tarda ~1 min en volver).
# Un servicio 24/7 usa ~744 h/mes, dentro de las 750 h gratis. El ping no consulta Supabase (el catálogo está en memoria).
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -o /dev/null -w '%{http_code} %{time_total}s\n' --retry 3 --retry-delay 20 --max-time 90 "https://sit-trucks.onrender.com/api/health" || true
